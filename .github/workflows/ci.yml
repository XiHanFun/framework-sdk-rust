name: CI

# Rust SDK 的门禁：格式与 clippy（missing_docs 随 -D warnings 生效）、文档、全部测试（读 spec/ 的一致性向量），不带与带 feature plugin
# 各一遍；插件运行时的黑盒一致性测试用 Go 跑规范子模块里的运行器；最低 Rust 版本；协议生成代码与 .proto 一致。
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 构建与测试
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出（含规范 submodule）
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 缓存 cargo 的注册表与 target：键含平台、工具链与依赖清单，两种 feature 组合共用一份
      - name: 缓存 cargo 产物
        uses: Swatinem/rust-cache@v2

      # tests/plugin_conformance.rs 用它在 spec/conformance 里 go run 黑盒运行器；版本跟着锁定的规范
      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: spec/conformance/go.mod
          cache-dependency-path: spec/conformance/go.sum

      - name: 格式与静态检查
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features plugin -- -D warnings

      - name: 文档
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --no-deps
          cargo doc --no-deps --features plugin

      - name: 测试
        shell: bash
        run: cargo test

      - name: 测试（插件运行时与黑盒一致性）
        shell: bash
        run: cargo test --features plugin

  msrv:
    name: 最低 Rust 版本（1.85）
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v5

      - name: 安装 Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: 缓存 cargo 产物
        uses: Swatinem/rust-cache@v2

      # 只构建库：测试读 spec/，在上面的作业里跑；依赖按 rust-version 解析到兼容的版本（tonic 到 0.14.5）
      - name: 构建
        run: |
          cargo build --lib
          cargo build --lib --features plugin

  protocol:
    name: 协议生成代码
    runs-on: ubuntu-latest
    steps:
      - name: 检出（含规范 submodule）
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      # 生成器是独立的工作区，它的 target 在 tools/protogen 下
      - name: 缓存 cargo 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/protogen

      # 从 spec/plugin/plugin.proto 重新生成，与提交的 src/plugin/generated 不同即失败；
      # 按 git status 判空：git diff 只看已跟踪的文件，发现不了新增的生成文件
      - name: 重新生成并核对
        run: |
          cargo run --locked --manifest-path tools/protogen/Cargo.toml
          if [ -n "$(git status --porcelain -- src/plugin/generated)" ]; then
            git status --porcelain -- src/plugin/generated
            git diff -- src/plugin/generated
            exit 1
          fi
